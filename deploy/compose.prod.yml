# Production stack for a single EU host (see docs/deployment.md).
#   cd deploy && cp .env.prod.example .env.prod && ./scripts/generate-secrets.sh >> .env.prod   (then edit)
#   docker compose --env-file .env.prod -f compose.prod.yml pull && docker compose --env-file .env.prod -f compose.prod.yml up -d
# Only Caddy publishes ports (80/443). Postgres, API and web are reachable on the internal network only.
name: handynet-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: handynet
      POSTGRES_USER: handynet_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      HANDYNET_APP_PASSWORD: ${HANDYNET_APP_PASSWORD:?set in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handynet_owner -d handynet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]
    shm_size: 256mb
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.5" }

  migrator:
    image: ${IMAGE_PREFIX:?set in .env.prod}-api:${IMAGE_TAG:-latest}
    command: ["migrate"]
    restart: "no"
    logging: *logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__HandyNetMigrations: Host=postgres;Database=handynet;Username=handynet_owner;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    <<: *hardening

  api:
    image: ${IMAGE_PREFIX:?set in .env.prod}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__HandyNet: Host=postgres;Database=handynet;Username=handynet_app;Password=${HANDYNET_APP_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set in .env.prod}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Cors__Origins__0: https://${DOMAIN:?set in .env.prod}
      Notifications__PublicBaseUrl: https://${DOMAIN}
      Notifications__FromAddress: ${MAIL_FROM:?set in .env.prod}
      Notifications__Smtp__Host: ${SMTP_HOST:?set in .env.prod}
      Notifications__Smtp__Port: ${SMTP_PORT:-587}
      Notifications__Smtp__Username: ${SMTP_USERNAME:-}
      Notifications__Smtp__Password: ${SMTP_PASSWORD:-}
      Notifications__Smtp__Security: ${SMTP_SECURITY:-Auto}
      # Trust X-Forwarded-* only from the Caddy network below (real client IPs for rate limits and audit).
      ForwardedHeaders__KnownNetworks__0: 172.30.0.0/24
      # Data Protection key ring (encrypts fiscal credentials): must survive container re-creation and be backed up.
      DataProtection__KeysPath: /data/keys
      FileStorage__Provider: ${FILESTORAGE_PROVIDER:-Local}
      FileStorage__Local__RootPath: /data/files
      FileStorage__S3__ServiceUrl: ${S3_SERVICE_URL:-}
      FileStorage__S3__Region: ${S3_REGION:-}
      FileStorage__S3__Bucket: ${S3_BUCKET:-}
      FileStorage__S3__AccessKey: ${S3_ACCESS_KEY:-}
      FileStorage__S3__SecretKey: ${S3_SECRET_KEY:-}
    volumes:
      - files:/data/files
      - dpkeys:/data/keys
    depends_on:
      migrator:
        condition: service_completed_successfully
    expose: ["8080"]
    healthcheck:
      # The aspnet image has no curl/wget: plain HTTP over bash /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/live HTTP/1.0\r\n\r\n" >&3 && head -n1 <&3 | grep -q " 200 "'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [internal]
    <<: *hardening
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.5" }

  web:
    image: ${IMAGE_PREFIX}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      HN_API_URL: http://api:8080
      # Angular SSR rejects unknown Host headers (SSRF guard). localhost/127.0.0.1 keep the healthcheck working.
      NG_ALLOWED_HOSTS: ${DOMAIN},localhost,127.0.0.1
      # Only Caddy can reach this container; it sets these headers itself and discards client-supplied values.
      NG_TRUST_PROXY_HEADERS: x-forwarded-host,x-forwarded-proto,x-forwarded-for
    depends_on:
      api:
        condition: service_healthy
    expose: ["4000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]
    <<: *hardening
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env.prod}
      CSP_IMG_EXTRA: ${CSP_IMG_EXTRA:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      internal:
        ipv4_address: 172.30.0.10
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits: { memory: 256m, cpus: "0.5" }

  backup:
    build: ./backup
    image: handynet-backup:local
    restart: unless-stopped
    logging: *logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-02:15}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-handynet}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - backups:/backups
      - files:/data/files:ro
      - dpkeys:/data/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 256m, cpus: "0.5" }

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  files:
  dpkeys:
  caddy_data:
  caddy_config:
  backups:
