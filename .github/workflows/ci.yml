name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HANDYNET_TEST_PG_ADMIN: Host=localhost;Port=5432;Username=postgres;Password=ci-only-password;Database=postgres
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore HandyNet.slnx
      - run: dotnet build HandyNet.slnx --no-restore -c Release -warnaserror
      # Fails if the model changed without a migration.
      - run: dotnet tool install --global dotnet-ef --version 10.0.*
      - run: dotnet ef migrations has-pending-model-changes -p src/HandyNet.Migrations -s src/HandyNet.Migrations --no-build --configuration Release
      - run: dotnet test HandyNet.slnx --no-build -c Release --logger "trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/TestResults

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node scripts/check-i18n.mjs
      - run: npm test
      - run: npm run build
      # Playwright e2e needs a running API + database; run it in a later stack job (see docs/roadmap.md).

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Multi-arch images: linux/amd64 (Hetzner, most VPS) and linux/arm64 (e.g. Oracle Cloud Ampere free tier).
      # Compilation runs natively ($BUILDPLATFORM in the Dockerfiles); QEMU only runs the small runtime-stage steps.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name prefix (lower-case owner)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/handynet" >> "$GITHUB_ENV"
      # Pull requests only build (proves the Dockerfiles work); pushes to main also push :<commit-sha> and :latest.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # Continuous deployment (docs/deployment.md §5): after the images for this commit are in GHCR, run deploy.sh on the
  # server over SSH (backup -> pull -> migrate -> start -> readiness check). Skipped until the DEPLOY_* secrets exist.
  deploy:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - name: Check deployment secrets
        id: cfg
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::Deployment skipped: set the repository secrets DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY (docs/deployment.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure SSH
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set: the server's host key is taken from the network unverified. Set it to the output of 'ssh-keyscan <host>'."
            ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy this commit
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "sh -s -- '${DEPLOY_PATH:-/opt/handynet}' '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          cd "$1"
          # compose.prod.yml, the Caddyfile and deploy.sh come from the repository: update them when the server has a clone.
          if [ -d .git ]; then
            git fetch --quiet origin main && git merge --quiet --ff-only "$2" \
              || echo "WARNING: could not update the repository files on the server; deploying with the files present." >&2
          fi
          cd deploy
          ./deploy.sh "$2"
          REMOTE
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
